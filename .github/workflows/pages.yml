name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check.py
      - run: for f in assets/app.mjs assets/scenes.mjs assets/scenes/*.mjs; do node --check "$f"; done
      - uses: actions/configure-pages@v6
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets en books _site/
          rm -f _site/assets/hero.svg _site/assets/strip.webp
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deploy
